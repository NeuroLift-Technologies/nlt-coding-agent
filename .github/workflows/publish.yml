name: Build and publish Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "hf/**"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "hf/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build React Static Space
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: hf
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Inspect AJV dependency tree
        working-directory: hf
        run: npm ls ajv ajv-keywords schema-utils || true

      - name: Build React application
        working-directory: hf
        env:
          CI: "true"
        run: npm run build

      - name: Prepare prebuilt Space payload
        run: |
          rm -rf hf/deploy
          mkdir -p hf/deploy
          cp -R hf/build/. hf/deploy/
          cp hf/README.md hf/deploy/README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nlt-coding-agent-hf-space
          path: hf/deploy/
          if-no-files-found: error

  publish:
    name: Publish to Hugging Face with OIDC
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download prebuilt Space payload
        uses: actions/download-artifact@v4
        with:
          name: nlt-coding-agent-hf-space
          path: hf/deploy

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Diagnose GitHub OIDC claims for Hugging Face
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fhuggingface.co" |
            python -c '
          import base64
          import json
          import sys

          response = json.load(sys.stdin)
          token = response.get("value")
          if not isinstance(token, str):
              raise SystemExit("GitHub OIDC endpoint did not return an ID token")

          parts = token.split(".")
          if len(parts) != 3:
              raise SystemExit("GitHub returned an unexpected JWT format")

          payload = parts[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          allowed = (
              "iss",
              "aud",
              "repository",
              "repository_owner",
              "ref",
              "ref_type",
              "workflow",
              "workflow_ref",
              "job_workflow_ref",
              "event_name",
              "sub",
          )
          safe_claims = {key: claims[key] for key in allowed if key in claims}
          print("Selected GitHub OIDC claims (the ID token itself is never logged):")
          print(json.dumps(safe_claims, indent=2, sort_keys=True))
          '

      - name: Publish static files to Hugging Face
        env:
          HF_OIDC_RESOURCE: spaces/divergent-tech/nlt-coding-agent
        run: |
          hf upload divergent-tech/nlt-coding-agent hf/deploy . \
            --commit-message "Deploy static build from ${GITHUB_SHA::7}"
