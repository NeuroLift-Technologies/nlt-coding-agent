name: Build and publish Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "hf/**"
      - ".github/workflows/publish-hf-space.yml"
  pull_request:
    branches: [main]
    paths:
      - "hf/**"
      - ".github/workflows/publish-hf-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build React Static Space
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: hf
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build React application
        working-directory: hf
        env:
          CI: "true"
        run: npm run build

      - name: Prepare prebuilt Space payload
        run: |
          rm -rf hf/deploy
          mkdir -p hf/deploy
          cp -R hf/build/. hf/deploy/
          cp hf/README.md hf/deploy/README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nlt-coding-agent-hf-space
          path: hf/deploy/
          if-no-files-found: error

      - name: Set up Python
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish prebuilt static files to Hugging Face
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing HF_TOKEN repository secret."
            exit 1
          fi
          python -m pip install --disable-pip-version-check huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id="divergent-tech/nlt-coding-agent",
              repo_type="space",
              folder_path="hf/deploy",
              commit_message=f"Deploy static build from GitHub {os.environ['GITHUB_SHA'][:7]}",
          )
          PY
